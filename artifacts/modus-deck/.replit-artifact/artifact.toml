kind = "slides"
previewPath = "/modus-deck/"
title = "Modus — Concept Proposal"
version = "1.0.0"
id = "artifacts/modus-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/modus-deck/" ]
localPort = 19125

[services.development]
run = "pnpm --filter @workspace/modus-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/modus-deck", "run", "build" ]
publicDir = "artifacts/modus-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19125"
BASE_PATH = "/modus-deck/"
