kind = "web"
previewPath = "/modus/"
title = "Modus — AI Commerce Intelligence"
version = "1.0.0"
id = "artifacts/modus-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/modus/" ]
localPort = 25975

[services.development]
run = "pnpm --filter @workspace/modus-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/modus-app", "run", "build" ]
publicDir = "artifacts/modus-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25975"
BASE_PATH = "/modus/"
